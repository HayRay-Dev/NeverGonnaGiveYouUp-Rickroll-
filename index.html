<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            cursor: pointer;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        /* Optional text hint */
        .hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial;
            font-size: 18px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="hint">Click anywhere for sound</div>

    <video id="video" autoplay muted playsinline>
        <source src="Rick_Astley_Never_Gonna_Give_You_Up.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("video");

        // Try to autoplay (will work muted)
        video.play().catch(() => {});

        // When user clicks anywhere → enable sound
        document.body.addEventListener("click", () => {
            video.muted = false;
            video.volume = 1.0;
            video.play();
        });
    </script>

</body>
</html>
